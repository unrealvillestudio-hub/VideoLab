# CI — corre los tests del repo en cada PR y en cada push a main.
#
# Por qué existe (2026-10-21): la barrera de voseo (`tests/sin_voseo_test.mjs`) y el resto de los
# tests sólo vigilaban si alguien corría `npm test` a mano. Sam pidió CI en los repos que no lo
# tenían, para que una regresión se vea en el PR y no después de mergear.
# Mismo patrón que `CopyLab/.github/workflows/ci.yml`.
name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm install
        working-directory: .
      # Motor HTML (F0, 2026-11-16): la prueba de determinismo de tests/html_engine_test.mjs captura con Chromium.
      # Sin Playwright se salta, y entonces nadie vigila la huella por fotograma; por eso se instala aquí, sin tocar
      # package.json ni el lock (el job de render todavía no lo usa).
      - run: npm install --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
        working-directory: .
      - run: npm test
        working-directory: .
